<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="800" fill="#F5F5F0"/>

  <!-- Simple Guitar Illustration -->
  <!-- Body -->
  <ellipse cx="400" cy="450" rx="180" ry="200" fill="none" stroke="#6B7280" stroke-width="3"/>

  <!-- Sound hole -->
  <circle cx="400" cy="450" r="50" fill="none" stroke="#6B7280" stroke-width="2"/>
  <circle cx="400" cy="450" r="42" fill="none" stroke="#6B7280" stroke-width="1"/>

  <!-- Neck -->
  <rect x="370" y="100" width="60" height="250" fill="none" stroke="#6B7280" stroke-width="3"/>

  <!-- Frets -->
  <line x1="370" y1="150" x2="430" y2="150" stroke="#6B7280" stroke-width="1"/>
  <line x1="370" y1="200" x2="430" y2="200" stroke="#6B7280" stroke-width="1"/>
  <line x1="370" y1="250" x2="430" y2="250" stroke="#6B7280" stroke-width="1"/>
  <line x1="370" y1="300" x2="430" y2="300" stroke="#6B7280" stroke-width="1"/>

  <!-- Strings -->
  <line x1="385" y1="100" x2="385" y2="650" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="395" y1="100" x2="395" y2="650" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="405" y1="100" x2="405" y2="650" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="415" y1="100" x2="415" y2="650" stroke="#9CA3AF" stroke-width="1"/>

  <!-- Headstock -->
  <path d="M 370 100 L 360 50 L 440 50 L 430 100" fill="none" stroke="#6B7280" stroke-width="3"/>

  <!-- Tuning pegs -->
  <circle cx="370" cy="65" r="5" fill="#6B7280"/>
  <circle cx="385" cy="60" r="5" fill="#6B7280"/>
  <circle cx="400" cy="55" r="5" fill="#6B7280"/>
  <circle cx="415" cy="60" r="5" fill="#6B7280"/>
  <circle cx="430" cy="65" r="5" fill="#6B7280"/>

  <!-- Bridge -->
  <rect x="370" y="650" width="60" height="8" rx="2" fill="#6B7280"/>

  <!-- Decorative elements -->
  <text x="400" y="750" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#9CA3AF" text-anchor="middle" font-weight="300">Guitar Notebook</text>
</svg>
